<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tokimi Open Source four-project signal bus</title>
  <desc id="description">A Tokimi signal bus branches to Tokimi Rover, AstroGroot, Darkforest Web, and the BridgeTime Kimi privacy-envelope reference.</desc>
  <defs>
