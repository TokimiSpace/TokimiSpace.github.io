        <circle cx="330" cy="83" r="22" fill="#6655c7"/>
        <circle cx="330" cy="83" r="8" fill="#f9fbf9"/>
      </g>
      <g stroke="#102129" stroke-width="4">
        <rect x="246" y="166" width="168" height="82" rx="9" fill="#102129"/>
        <path d="M274 211q25-23 50 0M336 211q25-23 50 0" fill="none" stroke="#00aaa5" stroke-linecap="round"/>
      </g>
      <path d="M224 278H436" fill="none" stroke="#6655c7" stroke-width="10" stroke-linecap="round"/>
      <g fill="none" stroke="#007370" stroke-width="2">
        <path d="M374 82h116"/>
        <path d="M414 206h108"/>
        <path d="M436 278h86"/>
