    </g>

    <g fill="#102129" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800" letter-spacing="1">
      <text x="982" y="224">OV3660</text>
      <text x="1006" y="323">OLED</text>
      <rect x="996" y="361" width="125" height="25" fill="#f9fbf9" fill-opacity="0.94"/>
      <text x="1004" y="379" font-size="11">32 × WS2812</text>
    </g>
    <g fill="#43585f" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="0.8">
      <text x="594" y="496">DUAL ESP32-S3 / SUPERVISED PROTOTYPE</text>
      <text x="1104" y="496" text-anchor="end">SOURCE AUDITED</text>
    </g>
  </g>

  <path d="M72 557H1128" fill="none" stroke="#345057" stroke-width="1"/>
  <g fill="#102129" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.2">
    <text x="72" y="588">V0.1 · SUPERVISED PROTOTYPE</text>
    <text x="1128" y="588" text-anchor="end">TOKIMISPACE.GITHUB.IO</text>
