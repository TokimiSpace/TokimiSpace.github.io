    <text x="91" y="503" fill="#43585f" font-family="PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="20" font-weight="600">原始碼與上蓋車殼 CAD 已公開</text>
  </g>

  <g>
    <rect x="570" y="124" width="558" height="400" rx="3" fill="#f9fbf9" fill-opacity="0.7" stroke="#345057" stroke-width="1.5"/>
