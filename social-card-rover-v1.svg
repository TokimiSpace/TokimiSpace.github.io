<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tokimi Rover open-source social card</title>
  <desc id="description">A bilingual Tokimi Rover system drawing announcing that source and top-cover CAD are available.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9c8c4" stroke-opacity="0.36" stroke-width="1"/>
    </pattern>
    <linearGradient id="top-signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007370"/>
      <stop offset="0.58" stop-color="#007370"/>
      <stop offset="0.58" stop-color="#6655c7"/>
      <stop offset="0.76" stop-color="#6655c7"/>
      <stop offset="0.76" stop-color="#dc5939"/>
      <stop offset="1" stop-color="#dc5939"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#edf3f0"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="4" fill="url(#top-signal)"/>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#102129">
    <text x="72" y="66" font-size="18" font-weight="700" letter-spacing="2.2">TOKIMI / OPEN SOURCE / PROJECT 01</text>
    <text x="1128" y="66" font-size="14" text-anchor="end" letter-spacing="1.8">OS.01 / 2026</text>
  </g>
  <path d="M72 94H1128" fill="none" stroke="#345057" stroke-width="1"/>

  <g font-family="Arial Narrow, Aptos Narrow, Helvetica Neue, Arial, sans-serif" fill="#102129">
    <text x="70" y="185" font-size="80" font-weight="800" letter-spacing="-4">TOKIMI</text>
    <text x="64" y="286" font-size="122" font-weight="900" letter-spacing="-7" fill="#007370">ROVER.</text>
  </g>
  <rect x="72" y="299" width="314" height="5" fill="#dc5939"/>

  <text x="74" y="347" fill="#102129" font-family="PingFang TC, Noto Sans TC, Arial, sans-serif" font-size="29" font-weight="700">開源模組化遙控車原型</text>
  <g fill="#43585f" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="0.8">
    <text x="75" y="384">2 × ESP32-S3 / BROWSER CONTROL</text>
    <text x="75" y="415">OV3660 / OLED FACE / 32 LEDs</text>
  </g>

  <g>
