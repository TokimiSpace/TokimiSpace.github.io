    <text x="70" y="161" fill="#43585f" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.8">OPEN CODE / CLEAR BOUNDARIES</text>
    <text x="68" y="246" fill="#102129" font-size="84" letter-spacing="-5">TOKIMI</text>
    <text x="66" y="346" fill="#007370" font-size="112" letter-spacing="-7">OPEN</text>
    <text x="67" y="426" fill="#102129" font-size="88" letter-spacing="-5">SOURCE.</text>
