<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Tokimi Open Source project signal bus</title>
  <desc id="description">A Tokimi signal bus branches to the open Tokimi Rover, AstroGroot, and Darkforest Web projects.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b9c8c4" stroke-opacity="0.34" stroke-width="1"/>
    </pattern>
    <linearGradient id="project-spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007370"/>
      <stop offset="0.333" stop-color="#007370"/>
      <stop offset="0.333" stop-color="#6655c7"/>
      <stop offset="0.666" stop-color="#6655c7"/>
      <stop offset="0.666" stop-color="#dc5939"/>
      <stop offset="1" stop-color="#dc5939"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#edf3f0"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="4" fill="url(#project-spectrum)"/>

  <g fill="#102129" font-family="SFMono-Regular, Menlo, Consolas, monospace">
